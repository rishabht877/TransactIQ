spring:
  application:
    name: fraud-service

server:
  port: 8082

transactiq:
  fraud:
    llm:
      # LLM triage layer. Default provider is Ollama (local, no API key). Set enabled=false to
      # run on deterministic rules only (tests/CI, or if no model is available).
      enabled: ${FRAUD_LLM_ENABLED:true}
      provider: ${FRAUD_LLM_PROVIDER:ollama}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${FRAUD_LLM_MODEL:llama3.2}
      temperature: 0.0
      timeout-seconds: 60
      # Total attempts per call. Keep at 1 so timeout-seconds is the real worst case (see LlmConfig).
      max-retries: ${FRAUD_LLM_MAX_RETRIES:1}
      circuit-breaker:
        # Open after this many consecutive LLM failures (timeout, connection error, unusable output).
        # While open the model is not called and the rules decide immediately. 0 disables the breaker.
        failure-threshold: ${FRAUD_LLM_BREAKER_FAILURES:3}
        # After this long one trial call is allowed; success closes the breaker, failure reopens it.
        cooldown-seconds: ${FRAUD_LLM_BREAKER_COOLDOWN_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: fraud-service
